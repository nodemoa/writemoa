[project]
name = "naegeulmoa"
version = "0.1.0"
description = "내글모아 — 내가 쓴 글을 분석해, AI가 블로그나 글을 내 문체 그대로 쓰게 해 주는 무료 MCP 서버. 만든 곳: 노드모아(nodemoa.com)"
readme = "README.md"
license = "MIT"
authors = [{ name = "노드모아 (Nodemoa)", email = "support@nodemoa.com" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.0,<3"]
keywords = ["mcp", "korean", "writing-style", "blog", "naver", "문체", "블로그"]

[project.urls]
Homepage = "https://nodemoa.com"
Source = "https://github.com/nodemoa/naegeulmoa"

[project.scripts]
naegeulmoa = "naegeulmoa.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naegeulmoa"]
